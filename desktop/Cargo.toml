[package]
name = "jha_invoice_maker"
version = "1.0.0"
edition = "2024"
description = "JHA Invoice Maker - native Rust desktop invoicing app"
authors = ["Jarif Hasan Akash"]

[[bin]]
name = "invoice_maker"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "accesskit", "clipboard", "default_fonts", "links"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "ico"] }
krilla = "0.8"
krilla-svg = "0.8"
resvg = "0.47"
rustybuzz = "0.20"
lopdf = { version = "0.47", default-features = false }
getrandom = "0.3"
rfd = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
chrono = "0.4"
base64 = "0.22"
dirs = "6"
rusty-leveldb = "4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev.package."*"]
opt-level = 2
